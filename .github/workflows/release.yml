name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-module-release.yml@9555dd71eccea98cfa82ca2bff27cedd9d154e4a
    with:
      module: github.com/spice-framework/spice
      workflow_commit: 9555dd71eccea98cfa82ca2bff27cedd9d154e4a
