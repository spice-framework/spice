name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-module-release.yml@fde3eccd4770233904f9adca0ebd35687f119d0e
    with:
      module: github.com/spice-framework/spice
      workflow_commit: fde3eccd4770233904f9adca0ebd35687f119d0e
