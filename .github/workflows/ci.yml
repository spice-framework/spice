name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.3.0
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: tools/go.sum
      - name: Bootstrap pinned tools
        run: go run ./internal/qualitygate -mode=tools-bootstrap
      - name: Verify offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: go run ./internal/qualitygate -mode=verify

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.3.0
        with:
          go-version: 1.26.6
      - name: Build packages
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          go build -trimpath ./...

  required:
    name: Required CI
    if: always()
    needs: [verify, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$CROSS_BUILD_RESULT" = "success"
